name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decompresser les zips
        run: for z in *.zip; do unzip -q -o "$z"; done
      - name: Construire l'APK
        run: bash build-apk.sh
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest FX-Karaoke.apk --target "$GITHUB_SHA" --title "F(X) Karaoke APK" --notes "APK de test (debug)"
